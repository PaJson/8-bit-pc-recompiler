; Miracle Warriors options (also in game: F1 / gamepad Start).
fm_sound       = 1     ; sound chip: 0 = PSG (original: Western consoles have no FM unit), 1 = FM (Japanese FM Sound Unit)
music_volume   = 100   ; music volume in percent (0..100)
sfx_volume     = 100   ; sound effects volume in percent (0..100)
walk_speed     = 2     ; walking speed on the map / in towns: 1 (original), 2 or 4
exp_multiplier      = 100   ; EXP per hit (the level bar) x N (0..100, 1 = original)
guilders_multiplier = 100   ; battle guilders reward x N (0..100, 1 = original)
fangs_multiplier    = 100   ; battle fangs reward x N (0..100, 1 = original)
char_points_multiplier = 100 ; character points gained in a battle x N (0..100, 1 = original; losses unchanged)
fast_forward   = 4     ; speed while TAB / pad RT is held: 0.5, 1, 2 or 4 (pad LT = x0.5)
