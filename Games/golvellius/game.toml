# game.toml — generic SMS game (no known jump tables)
# Z80, 256 KB ROM (16 x 16KB banks), Sega mapper, no battery RAM.
# Verified by rom_parser: platform=SMS region=SMS-Export crc32=0xB519E833
# Primary bring-up target.

[game]
output_prefix = "golvellius"
display_name  = "Golvellius - Valley of Doom (USA, Europe, Brazil) (En)"
platform      = "sms"
rom           = "../../ROMs/Golvellius - Valley of Doom (USA, Europe, Brazil) (En).sms"

# Per-game RAM layout the runner reads via g_game_layout (TODO: resolve from
# static analysis / SMS disassembly). SMS RAM is $C000-$DFFF (mirror $E000).
[ram_layout]
# game_mode     = 0x____
# vblank_count  = 0x____
# player_object = 0x____

[hooks]
on_post_reset = "gv_on_post_reset"   # Common/Golvellius/gv_qol.c: options, map fixes
on_frame_post = "gv_on_frame_post"   # gv_qol.c: test hooks

# QoL hooks (gv_qol.c; each returns 0 = original code): sword hit spots (`ld a,4 ; ld ($C120),a`), password made / password screen
[insn_hooks]
addr   = [0x3F45, 0x43AC, 0x4678, 0x8553, 0x85F6, 0x8620, 0x33EE, 0x37D8, 0x35EA, 0x914C, 0x19FE, 0x0435, 0x3509, 0x12C8, 0x4646, 0x6DEF]
func   = ["gv_sword_swing", "gv_sword_swing", "gv_sword_swing", "gv_pw_made", "gv_pw_entry", "gv_pw_loop", "gv_dmg_dealt", "gv_dmg_recv", "gv_gold_drop", "gv_dina", "gv_ow_music", "gv_frame_top", "gv_sword_reach", "gv_new_game", "gv_cave_down", "gv_snd_update"]
resume = [0x3F47, 0x43AE, 0x467A, 0x8553, 0x8603, 0x8623, 0x33EF, 0x37D9, 0x3604, 0x914F, 0x19FF, 0x0435, 0x3509, 0x12C8, 0x4646, 0x6DEF]
bank   = [-1, -1, -1, 7, 7, 7, -1, -1, -1, 7, -1, -1, -1, -1, -1, -1]   # password made / password screen: buffer clear, input loop head (bank 7)
# 2026-11-15: $33EE damage dealt (`ld e,a`), $37D8 damage received (`ld a,(hl)` of table $3697), $35EA gold drop (add -> $3604 cap),
# bank 7 $914C Dina (`ld bc,$0015`), $19FE overworld song (`ld a,(hl)` of table $1A15), $0435 main loop head (teleport, music switch),
# $3509 enemy-vs-sword box test (sword reach), $12C8 the new-game routine (save slots: the autosave starts empty),
# $4646 top-down cave hero `call $2F34` (velocity from direction x speed: CAVE DOWN SPEED),
# $6DEF sound driver frame update (2026-11-17: SOUND CHIP PSG / FM switched live)

[mapper]
kind = "sega"   # frame regs $FFFC-$FFFF; reset banks 0/1/2; first 1KB fixed

