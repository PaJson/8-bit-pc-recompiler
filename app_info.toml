# app_info.toml - who / what this app is. One place for the name and the version:
#   Tools/make_release.py         release folder + zip name "<name> v<version>", README text
#   .github/workflows/release.yml a tag v<version> must match `version` here (else the release fails)
#   Launcher/CMakeLists.txt       compiled into Launcher.exe (shown on its screens, Windows file properties)
# Version = semantic versioning MAJOR.MINOR.PATCH (0.x = before the first "finished" release).
name       = "8-bit PC Recompiler"
version    = "0.2.0"
repository = "https://github.com/PaJson/8-bit-pc-recompiler"
